name: Android watchdog

on:
  push:
    paths:
      - 'android/watchdog/**'
      - '.github/workflows/android-watchdog.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
  pull_request:
    paths:
      - 'android/watchdog/**'
      - '.github/workflows/android-watchdog.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Проверить и собрать APK
        working-directory: android/watchdog
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Собрать соответствующий tunnelctl для Termux
        run: |
          mkdir -p dist
          GOOS=android GOARCH=arm64 go build -ldflags "-X tunnelctl/internal/versioninfo.buildCommit=${GITHUB_SHA}" -o dist/tunnelctl-android-arm64 ./cmd/tunnelctl
          cp android/watchdog/app/build/outputs/apk/debug/app-debug.apk dist/tunnelctl-watchdog-test.apk
          cp android/watchdog/app/build/outputs/apk/release/app-release-unsigned.apk dist/tunnelctl-watchdog-unsigned.apk
          printf '%s\n' "${GITHUB_SHA}" > dist/source-commit.txt
          cd dist
          sha256sum tunnelctl-* > SHA256SUMS
      - name: Сохранить комплект для проверки
        uses: actions/upload-artifact@v4
        with:
          name: tunnelctl-android-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: Сохранить результаты проверок
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-checks-${{ github.sha }}
          path: |
            android/watchdog/app/build/reports/
            android/watchdog/app/build/test-results/
